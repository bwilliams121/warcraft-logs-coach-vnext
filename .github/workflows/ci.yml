name: CI

# Milestone 1 CI.
#
# This workflow deliberately declares NO secrets. The correctness suite is
# offline-first: nothing here reaches Warcraft Logs, and no Warcraft Logs
# credential is required for any test to pass. Tests that need credentials
# construct obvious sentinel values themselves.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test
